[project]
name = "dark-app-factory"
version = "0.2.0-beta"
description = "Software Factory scaffold for local AI models"
dependencies = [
    "openai>=1.52.0",
    "pydantic>=2.9.0",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0,<0.17",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
judge = [
    "playwright>=1.40.0",
]
verify = [
    "showboat",
    "rodney",
]

[project.scripts]
foreman = "dark_app_factory.foreman:main"
factory = "dark_app_factory.factory:main"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (e2e pipeline with Ollama, 10+ min)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/specialists/council.py" = ["E501"]
"src/verification/scenario_parser.py" = ["E501"]
"src/verification/scenario_executor.py" = ["E501", "S110"]
"src/verification/satisfaction_scorer.py" = ["E501"]
"src/verification/showboat_runner.py" = ["E501", "S603"]
"src/verification/rodney_runner.py" = ["E501", "S603"]
"src/verification/ruffy_runner.py" = ["S603"]
"src/deployment/deploy_artifacts.py" = ["E501", "S103"]
"src/pwa/pwa_artifacts.py" = ["E501"]
"src/utils/git_manager.py" = ["S603", "S607"]
"src/utils/ports.py" = ["S603", "S607"]
"src/utils/help_oracle.py" = ["RUF012"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
