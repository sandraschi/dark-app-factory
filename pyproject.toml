[project]
name = "dark-app-factory"
version = "0.1.0"
description = "Software Factory scaffold for local AI models"
dependencies = [
    "openai>=1.52.0",
    "pydantic>=2.9.0",
    "rich>=13.9.0", 
    "tenacity>=9.0.0",
]
requires-python = ">=3.11"

[project.scripts]
foreman = "dark_app_factory.foreman:main"
factory = "dark_app_factory.factory:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
