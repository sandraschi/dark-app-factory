name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev --group test

      - name: Ruff check
        run: uv run ruff check src/ --quiet

      - name: Ruff format
        run: uv run ruff format src/ --check --quiet

      - name: Tests
        run: uv run pytest tests/ -q -m "not slow" --deselect tests/test_e2e_scaffold.py --timeout=60

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: web_sota
        run: bun install --frozen-lockfile

      - name: Biome check
        working-directory: web_sota
        run: npx biome check src/

      - name: TypeScript build
        working-directory: web_sota
        run: bun run build
